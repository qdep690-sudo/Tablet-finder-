<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pharmacy Box Locator with Validation</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SheetJS Library for Excel parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body class="bg-slate-100 min-h-screen p-4 sm:p-6">

    <div class="max-w-2xl mx-auto space-y-6">

        <!-- HEADER -->
        <header class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm">
            <h1 class="text-xl sm:text-2xl font-bold text-blue-600">
                Mahalakshmi Medicals and Surgicals
            </h1>
        </header>

        <!-- SEARCH -->
        <section class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm space-y-3">

            <h2 class="text-base sm:text-lg font-semibold text-slate-700">
                Find Tablet / Composition
            </h2>

            <div class="relative">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Type brand name (e.g., Crocin 650)..."
                    class="w-full p-3.5 text-base border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>

            <div id="searchResults" class="mt-4 space-y-2">
                <p class="text-sm text-slate-400 italic">
                    Start typing to search inventory...
                </p>
            </div>

        </section>

        <!-- ENTRY GRID -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- MANUAL ENTRY -->
            <section class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm">

                <h2 class="text-base sm:text-lg font-semibold text-slate-700 mb-3">
                    Manual Entry
                </h2>

                <form id="manualForm" class="space-y-4">

                    <!-- BRAND -->
                    <div>

                        <label class="block text-xs font-medium text-slate-600 mb-1">
                            Brand Name <span class="text-red-500">*</span>
                        </label>

                        <div class="flex gap-2">

                            <input
                                type="text"
                                id="brandName"
                                placeholder="e.g. Dolo 650"
                                class="w-full p-3 text-base border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                                required
                            >

                            <button
                                type="button"
                                id="aiFillBtn"
                                class="bg-purple-100 text-purple-700 hover:bg-purple-200 text-xs px-3 rounded-xl font-semibold border border-purple-200 whitespace-nowrap"
                                title="Auto-fill composition using Gemini AI"
                            >
                                ✨ AI Fill
                            </button>

                        </div>

                    </div>

                    <!-- COMPOSITION -->
                    <div>

                        <label class="block text-xs font-medium text-slate-600 mb-1">
                            Composition / Salt
                        </label>

                        <input
                            type="text"
                            id="composition"
                            placeholder="Auto-filled or manual salt name"
                            class="w-full p-3 text-base border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                        >

                    </div>

                    <!-- BOX LOCATION -->
                    <div>

                        <label class="block text-xs font-medium text-slate-600 mb-1">
                            Box Location
                            <span class="text-red-500">*</span>
                            <span class="text-[10px] text-slate-400">
                                (Format: Letter + Number, e.g., A1)
                            </span>
                        </label>

                        <input
                            type="text"
                            id="boxLocation"
                            placeholder="e.g. A1"
                            class="w-full p-3 text-base border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white p-3 rounded-xl font-semibold shadow-md"
                    >
                        Save Location
                    </button>

                </form>

            </section>

            <!-- EXCEL UPLOAD -->
            <section class="bg-white p-5 sm:p-6 rounded-2xl shadow-sm">

                <h2 class="text-base sm:text-lg font-semibold text-slate-700 mb-3">
                    Upload Excel File
                </h2>

                <p class="text-xs text-slate-500 mb-4 leading-relaxed">

                    Accepted columns can include:

                    <code class="bg-slate-100 text-slate-700 px-1 py-0.5 rounded font-mono">
                        brand_name
                    </code>,
                    <code class="bg-slate-100 text-slate-700 px-1 py-0.5 rounded font-mono">
                        medicine name
                    </code>,
                    <code class="bg-slate-100 text-slate-700 px-1 py-0.5 rounded font-mono">
                        drug name
                    </code>

                    and similar composition/location names.

                </p>

                <!-- FILE INPUT + REMOVE BUTTON -->
                <div class="space-y-4">

                    <div class="flex items-center gap-2">

                        <input
                            type="file"
                            id="excelFile"
                            accept=".xlsx,.xls"
                            class="flex-1"
                        >

                        <!-- REMOVE FILE BUTTON -->
                        <button
                            type="button"
                            id="removeFileBtn"
                            title="Remove selected file"
                            aria-label="Remove selected file"
                            class="hidden text-red-600 hover:text-red-800 text-3xl font-bold px-3"
                        >
                            ×
                        </button>

                    </div>

                    <button
                        type="button"
                        id="uploadBtn"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white p-3 rounded-xl font-semibold shadow-md"
                    >
                        Process & Import Excel
                    </button>

                </div>

            </section>

        </div>

    </div>

    <!-- SEPARATE JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
